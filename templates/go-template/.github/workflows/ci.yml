name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofumpt
        run: test -z "$(go tool gofumpt -l .)"
      - run: go vet ./...
      - run: go fix -diff ./...
      - run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@v8
      - run: make hygiene
      - run: go test -race ./...
